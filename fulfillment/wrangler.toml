name = "dmosh-fulfillment"
main = "src/worker.mjs"
compatibility_date = "2024-11-01"

# Public-ish config (override in the dashboard if you prefer):
[vars]
FROM_EMAIL = "dmosh <licenses@example.com>"
# Where buyers download the prebuilt app. GitHub Releases is the standard home —
# attach the `npm run tauri:build` bundles to the release and this always points
# at the newest one.
DOWNLOAD_URL = "https://github.com/cbassuarez/dmosh/releases/latest"

# Secrets — DO NOT put these here. Set them with:
#   wrangler secret put STRIPE_WEBHOOK_SECRET
#   wrangler secret put LICENSE_PRIVATE_KEY     # the base64url 32-byte seed from `licctl keygen`
#   wrangler secret put RESEND_API_KEY
